              finance: {
                up: 'var(--color-up)',
                down: 'var(--color-down)',

    <style>
      body {
        background-color: #0d1117;

        --color-up: #ef4444;   /* Red Up */
        --color-down: #22c55e; /* Green Down */
      }
      /* Western Mode Class */
      .western-mode {
        --color-up: #22c55e;   /* Green Up */

      /* Custom Scrollbar */

        width: 8px;

      }

      }
      ::-webkit-scrollbar-thumb {
        background: #4a5568; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #718096; 
      }
